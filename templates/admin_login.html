{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Smart Campus</h1>
            <p class="text-slate-500 mt-1">Admin Portal</p>
        </div>
        <div class="card bg-white rounded-2xl p-8 shadow-sm border border-slate-100">
            <h2 class="text-xl font-semibold text-slate-800 mb-6">Admin Login</h2>
            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-smooth">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-smooth">
                </div>
                <div id="errorMsg" class="text-red-500 text-sm hidden"></div>
                <button type="submit" id="submitBtn"
                    class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition-smooth">
                    Sign In
                </button>
            </form>
            <p class="mt-6 text-center text-slate-500 text-sm">
                <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">Student Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
        const res = await fetch('/api/auth/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (data.success) window.location.href = '/admin/dashboard';
        else { err.textContent = data.message || 'Login failed'; err.classList.remove('hidden'); }
    } catch (_) { err.textContent = 'Network error'; err.classList.remove('hidden'); }
    btn.disabled = false;
    btn.textContent = 'Sign In';
});
</script>
{% endblock %}
