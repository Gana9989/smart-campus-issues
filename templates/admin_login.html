{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Smart Campus</h1>
            <p class="text-slate-500 mt-1">Admin Portal</p>
        </div>
        <div class="card bg-white rounded-2xl p-8 shadow-sm border border-slate-100">
            <h2 class="text-xl font-semibold text-slate-800 mb-6">Admin Login</h2>
            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-smooth">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            class="w-full px-4 py-2.5 pr-12 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-smooth">
                        <button type="button" id="togglePassword" aria-label="Show password" tabindex="-1"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 focus:outline-none focus:text-primary-600 transition-colors">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eyeSlashIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878a4.5 4.5 0 106.262 6.262M4 4l3 3m0 0l3-3m-3 3V4"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="errorMsg" class="text-red-500 text-sm hidden"></div>
                <button type="submit" id="submitBtn"
                    class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition-smooth">
                    Sign In
                </button>
            </form>
            <p class="mt-6 text-center text-slate-500 text-sm">
                <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">Student Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePassword(inputId, btnId, eyeId, eyeSlashId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const eye = document.getElementById(eyeId);
    const eyeSlash = document.getElementById(eyeSlashId);
    if (!input || !btn) return;
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    if (eye) eye.classList.toggle('hidden', isHidden);
    if (eyeSlash) eyeSlash.classList.toggle('hidden', !isHidden);
}
document.getElementById('togglePassword').addEventListener('click', () => {
    togglePassword('password', 'togglePassword', 'eyeIcon', 'eyeSlashIcon');
});
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
        const res = await fetch('/api/auth/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (data.success) window.location.href = '/admin/dashboard';
        else { err.textContent = data.message || 'Login failed'; err.classList.remove('hidden'); }
    } catch (_) { err.textContent = 'Network error'; err.classList.remove('hidden'); }
    btn.disabled = false;
    btn.textContent = 'Sign In';
});
</script>
{% endblock %}
