<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console verification (PASTE YOUR CODE HERE) -->
    <!-- <meta
      name="google-site-verification"
      content="PASTE_YOUR_CODE_FROM_GOOGLE"
    /> -->
    <meta
      name="google-site-verification"
      content="yHtYOQxjTZSeWAkOqFAxP4V5bNeFQUDFhDjdS0N3PMU"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Smart Campus Issue Reporting System – report and track campus problems easily."
    />
    <meta
      name="keywords"
      content="smart campus, issue reporting, college app, student complaints"
    />
    <meta name="author" content="Smart Campus" />

    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.png') }}"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="{{ url_for('static', filename='favicon.png') }}"
    />

    <title>{% block title %}Smart Campus{% endblock %} | Issue Reporting</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#eff6ff",
                100: "#dbeafe",
                200: "#bfdbfe",
                300: "#93c5fd",
                400: "#60a5fa",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
                800: "#1e40af",
                900: "#1e3a8a",
              },
            },
          },
        },
      };
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --primary-color: #2563eb;
        --border-color: #e2e8f0;
        --shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      }

      body.dark {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f1f5f9;
        --text-muted: #94a3b8;
        --primary-color: #60a5fa;
        --border-color: #334155;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.25);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        transition: all 0.3s ease;
      }

      .card {
        background: var(--card-bg);
        box-shadow: var(--shadow);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .card:hover {
        transform: scale(1.02);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      }

      .theme-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.5rem;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in {
        animation: fadeInUp 0.4s ease-out;
      }
    </style>

    {% block head %}{% endblock %}
  </head>

  <body class="min-h-screen">
    <script>
      (function () {
        const saved = localStorage.getItem("smart-campus-theme");
        if (
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.body.classList.add("dark");
        }
      })();
    </script>

    <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">
      🌙
    </button>

    <div class="fade-in min-h-screen">{% block body %}{% endblock %}</div>

    <script>
      const toggle = document.getElementById("themeToggle");

      toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem(
          "smart-campus-theme",
          document.body.classList.contains("dark") ? "dark" : "light",
        );
      });
    </script>

    {% block scripts %}{% endblock %}
  </body>
</html>
